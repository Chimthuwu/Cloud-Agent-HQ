name: Worker - OpenCode

on:
  workflow_dispatch:
    inputs:
      task_json:
        description: "Full task contract JSON"
        required: true
        type: string
      task_id:
        description: "Task ID"
        required: true
        type: string
      repository:
        description: "Target repository (owner/name)"
        required: true
        type: string
      base_branch:
        description: "Base branch"
        required: true
        type: string
        default: "main"
      timeout_minutes:
        description: "Timeout in minutes"
        required: true
        type: string
        default: "30"
      tracking_issue:
        description: "Tracking issue number in Cloud-Agent-HQ"
        required: true
        type: string

permissions:
  contents: read
  # Target repo permissions granted via repository secrets

jobs:
  execute:
    name: Execute OpenCode Task
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event.inputs.timeout_minutes }}
    env:
      TASK_ID: ${{ github.event.inputs.task_id }}
      REPOSITORY: ${{ github.event.inputs.repository }}
      BASE_BRANCH: ${{ github.event.inputs.base_branch }}
      TRACKING_ISSUE: ${{ github.event.inputs.tracking_issue }}
      OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
      OPENCODE_MODEL: ${{ secrets.OPENCODE_MODEL || 'sonnet-4' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Target repo PAT for push/PR creation
      TARGET_REPO_PAT: ${{ secrets.CLOUD_AGENT_HQ_PAT }}
    steps:
      - name: Checkout Cloud-Agent-HQ (for adapter scripts)
        uses: actions/checkout@v4
        with:
          path: cloud-agent-hq

      - name: Write task JSON
        run: |
          echo '${{ github.event.inputs.task_json }}' > task.json
          cat task.json | jq .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install OpenCode
        run: npm install -g opencode-ai@latest

      - name: Verify OpenCode installation
        run: |
          opencode --version
          opencode doctor || true

      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.repository }}
          ref: ${{ github.event.inputs.base_branch }}
          token: ${{ secrets.CLOUD_AGENT_HQ_PAT }}
          path: target-repo

      - name: Create working branch
        working-directory: target-repo
        run: |
          git config user.name "cloud-agent[bot]"
          git config user.email "cloud-agent@users.noreply.github.com"
          
          BRANCH_NAME="cloud-agent/${{ github.event.inputs.task_id }}/opencode"
          git checkout -b "$BRANCH_NAME"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Read repository instructions
        id: read-instructions
        working-directory: target-repo
        run: |
          INSTRUCTIONS=""
          for file in AGENTS.md CLAUDE.md README.md TODO.md docs/ARCHITECTURE.md; do
            if [ -f "$file" ]; then
              INSTRUCTIONS+="\n\n=== $file ===\n"
              INSTRUCTIONS+=$(cat "$file")
            fi
          done
          echo "instructions<<EOF" >> $GITHUB_OUTPUT
          echo "$INSTRUCTIONS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run OpenCode adapter
        id: opencode
        working-directory: target-repo
        env:
          TASK_INSTRUCTIONS: ${{ github.event.inputs.task_json }}
          REPO_INSTRUCTIONS: ${{ steps.read-instructions.outputs.instructions }}
          TASK_ID: ${{ github.event.inputs.task_id }}
          BRANCH_NAME: ${{ env.BRANCH_NAME }}
        run: |
          bash ../cloud-agent-hq/workers/opencode/adapter.sh \
            ../task.json \
            . \
            ../execution-report.json

      - name: Check execution status
        id: check-status
        run: |
          cat execution-report.json | jq .
          STATUS=$(cat execution-report.json | jq -r .status)
          PR_NUMBER=$(cat execution-report.json | jq -r .pr_number)
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          if [ "$STATUS" = "success" ] || [ "$STATUS" = "partial" ]; then
            echo "::notice::Task completed with status: $STATUS"
          else
            echo "::error::Task failed with status: $STATUS"
          fi

      - name: Update tracking issue - success
        if: steps.check-status.outputs.status == 'success' || steps.check-status.outputs.status == 'partial'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt("${{ github.event.inputs.tracking_issue }}");
            const taskId = "${{ github.event.inputs.task_id }}";
            const prNumber = ${{ steps.check-status.outputs.pr_number }};
            const branch = "${{ env.BRANCH_NAME }}";
            const repo = "${{ github.event.inputs.repository }}";
            
            await github.rest.issues.createComment({
              owner: "Chimthuwu",
              repo: "Cloud-Agent-HQ",
              issue_number: issueNumber,
              body: `✅ **Task completed successfully**
              
              **Task ID:** \`${taskId}\`
              **Repository:** ${repo}
              **Branch:** \`${branch}\`
              **Pull Request:** #${prNumber} (https://github.com/${repo}/pull/${prNumber})
              **Status:** ${{ steps.check-status.outputs.status }}
              
              The PR is ready for review.`
            });
            
            // Add label
            await github.rest.issues.addLabels({
              owner: "Chimthuwu",
              repo: "Cloud-Agent-HQ",
              issue_number: issueNumber,
              labels: ["status:completed", "status:pr-ready"]
            });

      - name: Update tracking issue - failure
        if: steps.check-status.outputs.status == 'failed' || steps.check-status.outputs.status == 'timeout'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt("${{ github.event.inputs.tracking_issue }}");
            const taskId = "${{ github.event.inputs.task_id }}";
            const status = "${{ steps.check-status.outputs.status }}";
            
            // Read error details
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('execution-report.json', 'utf8'));
            const errors = report.errors || [];
            
            await github.rest.issues.createComment({
              owner: "Chimthuwu",
              repo: "Cloud-Agent-HQ",
              issue_number: issueNumber,
              body: `❌ **Task failed**
              
              **Task ID:** \`${taskId}\`
              **Status:** ${status}
              **Errors:**
              ${errors.map(e => \`- \${e}\`).join('\n') || 'See workflow logs'}
              
              Check workflow run for details: https://github.com/Chimthuwu/Cloud-Agent-HQ/actions/runs/${{ github.run_id }}`
            });
            
            await github.rest.issues.addLabels({
              owner: "Chimthuwu",
              repo: "Cloud-Agent-HQ",
              issue_number: issueNumber,
              labels: ["status:failed"]
            });

      - name: Upload execution report
        uses: actions/upload-artifact@v4
        with:
          name: execution-report-${{ github.event.inputs.task_id }}
          path: execution-report.json
          retention-days: 30

concurrency:
  group: cloud-agent-opencode-${{ github.event.inputs.task_id }}
  cancel-in-progress: false