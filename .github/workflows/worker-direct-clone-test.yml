name: Worker - Direct Git Clone Test

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Target repository (owner/name)"
        required: true
        type: string
      base_branch:
        description: "Base branch"
        required: true
        type: string
        default: "main"

permissions:
  contents: read

jobs:
  execute:
    name: Direct Git Clone Test
    runs-on: ubuntu-latest
    env:
      PAT_TOKEN: ${{ secrets.CLOUD_AGENT_HQ_PAT }}
    steps:
      - name: Clone with git
        run: |
          git clone https://${PAT_TOKEN}@github.com/${{ github.event.inputs.repository }}.git target-repo -b ${{ github.event.inputs.base_branch }}
      - name: List files
        working-directory: target-repo
        run: ls -la