name: Worker - Codex

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "Task ID"
        required: true
        type: string
      repository:
        description: "Target repository (owner/name)"
        required: true
        type: string
      base_branch:
        description: "Base branch"
        required: true
        type: string
        default: "main"
      timeout_minutes:
        description: "Timeout in minutes"
        required: true
        type: number
        default: 30
      tracking_issue:
        description: "Tracking issue number in Cloud-Agent-HQ"
        required: true
        type: string

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  execute:
    name: Execute Codex Task
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TASK_ID: ${{ github.event.inputs.task_id }}
      REPOSITORY: ${{ github.event.inputs.repository }}
      BASE_BRANCH: ${{ github.event.inputs.base_branch }}
      TRACKING_ISSUE: ${{ github.event.inputs.tracking_issue }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Cloud-Agent-HQ (for adapter scripts)
        uses: actions/checkout@v4
        with:
          path: cloud-agent-hq

      - name: Write task JSON
        uses: actions/github-script@v7
        with:
          script: |
            const taskJson = '${{ github.event.inputs.task_json }}';
            const fs = require('fs');
            fs.writeFileSync('task.json', taskJson);

      - name: Clone target repository
        run: |
          git clone https://${{ secrets.CLOUD_AGENT_HQ_PAT }}@github.com/${{ github.event.inputs.repository }}.git target-repo -b ${{ github.event.inputs.base_branch }}

      - name: Setup Node.js (for Codex CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Codex CLI
        run: npm install -g @openai/codex@latest

      - name: Verify Codex installation
        run: |
          codex --version
          codex --help

      - name: Run Codex adapter
        working-directory: target-repo
        env:
          TASK_ID: ${{ env.TASK_ID }}
          REPOSITORY: ${{ env.REPOSITORY }}
          BASE_BRANCH: ${{ env.BASE_BRANCH }}
          OPENAI_API_KEY: ${{ env.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash ../cloud-agent-hq/workers/codex/adapter.sh ../task.json . /tmp/execution-report.json

      - name: Check execution status
        run: |
          cat /tmp/execution-report.json | jq .
          STATUS=$(cat /tmp/execution-report.json | jq -r .status)
          PR_NUMBER=$(cat /tmp/execution-report.json | jq -r .pr_number)
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          if [ "$STATUS" = "success" ] || [ "$STATUS" = "partial" ]; then
            echo "::notice::Task completed with status: $STATUS"
          else
            echo "::error::Task failed with status: $STATUS"
          fi
        id: check_status

      - name: Upload execution report
        uses: actions/upload-artifact@v4
        with:
          name: execution-report-${{ env.TASK_ID }}
          path: /tmp/execution-report.json

      - name: Update tracking issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt("${{ github.event.inputs.tracking_issue }}");
            const taskId = "${{ env.TASK_ID }}";
            const prNumber = parseInt("${{ steps.check_status.outputs.pr_number }}") || 0;
            const branch = "cloud-agent/${{ env.TASK_ID }}/codex";
            const repo = "${{ env.REPOSITORY }}";
            const status = "${{ steps.check_status.outputs.status }}";
            
            await github.rest.issues.createComment({
              owner: "Chimthuwu",
              repo: "Cloud-Agent-HQ",
              issue_number: issueNumber,
              body: "✅ **Task completed successfully**\n\n**Task ID:** `" + taskId + "`\n**Repository:** " + repo + "\n**Branch:** `" + branch + "`\n**Pull Request:** #" + prNumber + " (https://github.com/" + repo + "/pull/" + prNumber + ")\n**Status:** " + status + "\n\nThe PR is ready for review."
            });
            
            await github.rest.issues.addLabels({
              owner: "Chimthuwu",
              repo: "Cloud-Agent-HQ",
              issue_number: issueNumber,
              labels: ["status:completed", "status:pr-ready"]
            });