name: Worker - Node Test

on:
  workflow_dispatch:
    inputs:
      task_json:
        description: "Full task contract JSON"
        required: true
        type: string
      task_id:
        description: "Task ID"
        required: true
        type: string
      repository:
        description: "Target repository (owner/name)"
        required: true
        type: string
      base_branch:
        description: "Base branch"
        required: true
        type: string
        default: "main"
      timeout_minutes:
        description: "Timeout in minutes"
        required: true
        type: number
        default: 30
      tracking_issue:
        description: "Tracking issue number in Cloud-Agent-HQ"
        required: true
        type: string

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  execute:
    name: Node Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TASK_ID: ${{ github.event.inputs.task_id }}
      REPOSITORY: ${{ github.event.inputs.repository }}
      BASE_BRANCH: ${{ github.event.inputs.base_branch }}
      TRACKING_ISSUE: ${{ github.event.inputs.tracking_issue }}
      OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
      OPENCODE_MODEL: ${{ secrets.OPENCODE_MODEL }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Cloud-Agent-HQ (for adapter scripts)
        uses: actions/checkout@v4
        with:
          path: cloud-agent-hq

      - name: Write task JSON
        uses: actions/github-script@v7
        with:
          script: |
            const taskJson = `${{ github.event.inputs.task_json }}`;
            const fs = require('fs');
            fs.writeFileSync('task.json', taskJson);

      - name: Clone target repository
        run: |
          git clone https://${{ secrets.CLOUD_AGENT_HQ_PAT }}@github.com/${{ github.event.inputs.repository }}.git target-repo -b ${{ github.event.inputs.base_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install OpenCode
        run: npm install -g opencode-ai@latest

      - name: Verify OpenCode installation
        run: |
          opencode --version
          opencode doctor || true